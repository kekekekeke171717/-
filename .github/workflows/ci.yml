name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 语法检查
        run: python -m compileall -q src tests examples scripts

      - name: 静态检查（可选，失败不阻断）
        continue-on-error: true
        run: |
          pip install -q ruff || exit 0
          ruff check src tests examples scripts

      - name: 跑测试
        env:
          PYTHONPATH: src
        run: pytest tests -q --cov=clinic_triage --cov-report=term-missing

      - name: 端到端冒烟（demo 必须能跑出产物）
        env:
          PYTHONPATH: src
        run: |
          python -m clinic_triage check --data data/appointments.csv
          python -m clinic_triage demo --data data/appointments.csv --out out
          test -s out/dashboard.html
          test -s out/suggestions.csv
          test -s out/audit.jsonl

      - name: 示例脚本必须无异常退出
        env:
          PYTHONPATH: src
        run: python examples/demo.py
