name: 发布看板到 Pages

# 产物 out/dashboard.html 是自包含单文件 Pages 源。
# 首次使用需在仓库 Settings → Pages → Build and deployment 里
# 选择 "Deploy from a branch"，分支 gh-pages、目录 / (root)。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "config/**"
      - "scripts/deploy.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成看板
        env:
          PYTHONPATH: src
        run: |
          python scripts/gen_data.py
          python scripts/gen_diagrams.py
          bash scripts/deploy.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
