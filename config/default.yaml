clinic:
  name: 东湖门诊中心
  scope: 内科门诊、儿科门诊（并行试点，不替换现有业务）
  pilot_weeks: 4

rules:
  # 迟到宽限：超过 15 分钟才让出当前波次（事实 f10）
  late_grace_min: 15
  # 现状叫号机：叫不到人就空等这么多分钟再过号（事实 f00 爽约率 19%）
  call_grace_min: 3
  # 过号后隔多久再叫一轮；max_recall=1 表示"叫一次不应答就过号"
  recall_gap_min: 15
  max_recall: 1
  # 让位保护：迟到/加号让位满 45 分钟后自动回到正常次序，
  # 否则队尾的人会无限被推后 —— 这是最容易忽略的设计缺陷
  defer_protect_min: 45
  # 医生进度落后超过 20 分钟，提示更正预计时段（不承诺具体分钟，事实 f34）
  overrun_min: 20
  # 脆弱人群判定
  vulnerable_age_high: 75
  vulnerable_age_low: 6

simulation:
  day_start: "08:00"
  # 样本数据只有一个上午号源，排班终点放到 12:20 便于队尾清空
  day_end: "12:20"
  # 看板取这一时刻的候诊队列。
  # 取 09:20 是因为这一刻四条分带都在队列里：既有急症转人工，
  # 也有待复核的优先患者 —— 单看 10:00 只剩正常队列，演示不出边界。
  snapshot: "09:20"
